<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Phantom · Crypto Bros</title><style>body{background:#101310;color:#e3e9df;font:16px system-ui;max-width:560px;margin:12vh auto;padding:28px}h1{font-size:38px}button{background:#b8ed82;border:0;padding:16px 25px;border-radius:8px;font-weight:700;cursor:pointer}p{line-height:1.7;color:#a7b3a3}#status{overflow-wrap:anywhere}.tag{color:#b8ed82;font-size:12px;letter-spacing:2px}</style></head><body><div class="tag">CRYPTO BROS / WALLET CONNECTION</div><h1>Your keys stay<br>in Phantom.</h1><p>This connects only your public Solana address. Crypto Bros will not request a recovery phrase, private key, signature, or transfer. This release supports paper trading and read-only quotes.</p><button id="connect">Connect Phantom</button><p id="status"></p><script>
const ticket=location.hash.slice(1);history.replaceState(null,'',location.pathname);const status=document.getElementById('status');
document.getElementById('connect').onclick=async()=>{try{if(!ticket)throw new Error('Open a fresh connection link from Crypto Bros.');const provider=window.phantom?.solana;if(!provider?.isPhantom)throw new Error('Install Phantom in this browser from phantom.com/download, then open a fresh link.');const result=await provider.connect();const response=await fetch('/wallet/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket,address:result.publicKey.toString()})});const body=await response.json();if(!response.ok)throw new Error(body.error);status.textContent='Connected public address '+result.publicKey.toString()+'. Return to Crypto Bros. No funds moved.';}catch(error){status.textContent=error.message||'Connection failed.';}};
</script></body></html>
