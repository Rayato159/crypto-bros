[package]
name = "crypto-bros"
version = "0.6.0"
edition = "2024"
description = "SOL/USDC research workstation with Phantom-approved trading"
license = "MIT"

[workspace]
members = ["crates/core", "ui", "src-tauri"]
default-members = [".", "crates/core"]
resolver = "2"

[dependencies]
crypto-bros-core = { path = "crates/core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
directories = "6"
thiserror = "2"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"
minisign-verify = "0.3"

[profile.release]
lto = "thin"
strip = true
